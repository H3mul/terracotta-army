# Container-level integration harness: the real broker image, its operator sshd, and a sandbox-side
# client, against a stub GitHub and TokenReview. No Kubernetes. Driven by test_compose.py, which
# supplies TG_IT_DIR (keys, policy) and a unique project name. Build context is the repo root.
name: ${COMPOSE_PROJECT_NAME:-tg-it}

# Hardening applied to the three product containers; they must run fully under it (ta-general 5.1).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

x-broker-env: &broker-env
  TG_POLICY: /etc/terracotta/policy.yaml
  TG_SANDBOX_IDENTITY: system:serviceaccount:ws:sandbox
  TG_READER_CLIENT_ID: Iv-it
  TG_READER_KEY: /etc/terracotta/reader.pem
  TG_GITHUB_API: http://stub:8000
  TG_GITHUB_WEB: http://stub:8000
  TG_WRITER_CLIENT_ID: Iv-it  # the stub serves both Apps under one client id
  TG_WRITER_SECRET: /etc/terracotta/writer-secret
  TG_KUBE_API: http://stub:8000
  TG_KUBE_TOKEN: /etc/terracotta/broker-token
  TG_LISTEN_PORT: "8080"
  TG_AUDIT_FILE: /var/lib/terracotta/audit.log

services:
  stub:
    build: {context: ../.., dockerfile: tests/integration/stub/Dockerfile}
    environment: {PUBKEY: /keys/reader.pub, CLIENT_ID: Iv-it, WRITER_SECRET: it-writer-secret}
    volumes: ["${TG_IT_DIR}:/keys:ro"]
    networks: {default: {aliases: [github.com]}}  # git clients reach it as github.com over TLS

  broker:
    <<: *hardened
    build: {context: ../.., dockerfile: general/Dockerfile}
    environment: *broker-env
    volumes:
      - ${TG_IT_DIR}/policy.yaml:/etc/terracotta/policy.yaml:ro
      - ${TG_IT_DIR}/reader.pem:/etc/terracotta/reader.pem:ro
      - ${TG_IT_DIR}/broker-token:/etc/terracotta/broker-token:ro
      - ${TG_IT_DIR}/writer-secret:/etc/terracotta/writer-secret:ro
      - admin:/run/terracotta
      - state:/var/lib/terracotta
    depends_on: [stub]

  sshd:
    <<: *hardened
    image: tg-it-broker
    build: {context: ../.., dockerfile: general/Dockerfile}
    entrypoint: ["tg-sshd"]
    environment: {TG_AUDIT_FILE: /var/lib/terracotta/audit.log}
    volumes:
      - ${TG_IT_DIR}/authorized_keys:/etc/terracotta/authorized_keys:ro
      - admin:/run/terracotta
      - state:/var/lib/terracotta
      - sshkeys:/var/lib/terracotta-ssh

  # The operator's phone: an ssh client with the authorized key.
  operator:
    image: tg-it-broker
    entrypoint: ["sleep", "infinity"]
    user: root  # the key is 0600 and owned by whoever runs the tests (uid 1001 on CI runners)
    volumes: ["${TG_IT_DIR}/operator_key:/key:ro"]

  # The workspace: the real workspace image (supervisor, sshd, git helper, ws) as the unprivileged
  # agent. It can reach the broker's TCP API only; it has no admin socket and no key, just its
  # identity token. The operator reaches its sshd with the same key used for the broker.
  sandbox:
    <<: *hardened
    build: {context: ../.., dockerfile: workspace/Dockerfile}
    environment:
      TG_BROKER: http://broker:8080
      TG_TOKEN_FILE: /run/identity/token
      GIT_SSL_CAINFO: /keys/tls.crt  # trust the stub's certificate for github.com
    volumes:
      - ${TG_IT_DIR}/sandbox-token:/run/identity/token:ro
      - ${TG_IT_DIR}/tls.crt:/keys/tls.crt:ro
      - ${TG_IT_DIR}/authorized_keys:/etc/terracotta-workspace/authorized_keys:ro
      - home:/home/agent
      - workspace:/workspace

volumes: {admin: {}, state: {}, sshkeys: {}, home: {}, workspace: {}}
