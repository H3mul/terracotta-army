[project]
name = "terracotta-general"
version = "0.0.0"
description = "Access broker for the terracotta-army agent workspace"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
terracotta-general = "terracotta_general.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terracotta_general"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
