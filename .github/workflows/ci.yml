name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
permissions:
  contents: read
jobs:
  general:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project general ruff check general workspace tests
      - run: uv run --directory general mypy src
      - run: uv run --project general pytest general/tests workspace/tests tests/hygiene
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Uncached, building the three images took about 3 of the 5 minutes: build them once with a layer cache.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., file: general/Dockerfile, load: true, tags: tg-it-broker, cache-from: "type=gha,scope=it-broker", cache-to: "type=gha,scope=it-broker,mode=max"}
      - uses: docker/build-push-action@v6
        with: {context: ., file: tests/integration/stub/Dockerfile, load: true, tags: tg-it-stub, cache-from: "type=gha,scope=it-stub", cache-to: "type=gha,scope=it-stub,mode=max"}
      - uses: docker/build-push-action@v6
        with: {context: ., file: workspace/Dockerfile, load: true, tags: tg-it-workspace, cache-from: "type=gha,scope=it-workspace", cache-to: "type=gha,scope=it-workspace,mode=max"}
      - run: uv run --project general pytest tests/integration -v
        env: { TG_IT_PREBUILT: "1" }
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [general, secrets, integration]
    runs-on: ubuntu-latest
    # a human presses "Review deployments": the agent's token can push a tag but cannot approve this
    environment: release
    permissions: { contents: write, packages: write, id-token: write }
    env:
      GENERAL: ghcr.io/${{ github.repository_owner }}/terracotta-general
      WORKSPACE: ghcr.io/${{ github.repository_owner }}/terracotta-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: general
        uses: docker/build-push-action@v6
        with: { context: ., file: general/Dockerfile, push: true, tags: "${{ env.GENERAL }}:${{ github.ref_name }}" }
      - id: workspace
        uses: docker/build-push-action@v6
        with: { context: ., file: workspace/Dockerfile, push: true, tags: "${{ env.WORKSPACE }}:${{ github.ref_name }}" }
      - uses: sigstore/cosign-installer@v3
      - name: Sign both images by digest (keyless)
        run: |
          cosign sign --yes "${GENERAL}@${{ steps.general.outputs.digest }}"
          cosign sign --yes "${WORKSPACE}@${{ steps.workspace.outputs.digest }}"
      - name: Release notes with the digests table
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          {
            echo "| image | tag | digest |"
            echo "|---|---|---|"
            echo "| terracotta-general | ${{ github.ref_name }} | ${{ steps.general.outputs.digest }} |"
            echo "| terracotta-workspace | ${{ github.ref_name }} | ${{ steps.workspace.outputs.digest }} |"
            echo
            echo "Contract version: $(cat contract/VERSION)"
          } > notes.md
          gh release create "${{ github.ref_name }}" --generate-notes --notes-file notes.md
