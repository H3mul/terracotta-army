name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
permissions:
  contents: read
jobs:
  general:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project general ruff check general workspace
      - run: uv run --project general --directory general mypy src
      - run: uv run --project general pytest general/tests workspace/tests tests/hygiene
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [general, secrets]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: general/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/terracotta-general:${{ github.ref_name }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: workspace/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/terracotta-workspace:${{ github.ref_name }}" }
